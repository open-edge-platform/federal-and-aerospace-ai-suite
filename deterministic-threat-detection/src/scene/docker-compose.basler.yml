#
# SOURCE=basler: the pipeline server gets the pylon/gencamsrc image and a macvlan interface on the cameras' TSN VLAN
# (tsn0.3, VLAN 3), so GigE Vision discovery and the camera stream (192.168.3.x) reach the container directly.
# The scenescape network stays attached for the broker; the macvlan has no gateway, so default traffic keeps
# using the scenescape network. (Docker does not let the host itself talk to a macvlan address - not needed.)
services:
  dlstreamer-pipeline-server:
    build:
      context: ./basler
      dockerfile: BaslerDockerfile
      args:
        BASE_IMAGE: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    volumes:
      - /dev:/dev  # device access for the camera SDK (USB cameras; harmless for GigE)
    image: tsn-dlstreamer-pipeline-server-basler:${SCENESCAPE_VERSION}
    networks:
      scenescape:
        gw_priority: 1
      cameras:
        ipv4_address: ${BASLER_CONTAINER_IP:-192.168.3.61}
        gw_priority: 0

networks:
  cameras:
    driver: macvlan
    driver_opts:
      parent: ${BASLER_PARENT_IFACE:-tsn0.3}
    ipam:
      config:
        - subnet: ${BASLER_SUBNET:-192.168.3.0/24}
          ip_range: ${BASLER_IP_RANGE:-192.168.3.60/30}
